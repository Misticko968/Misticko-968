        .custom-flame-badge {
            display: inline-block;
            width: 15px;
            height: 22px;
            background: linear-gradient(to top, #ff2200, #ff5500, #ffcc00);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            position: relative;
            box-shadow: 0 0 10px rgba(255, 85, 0, 0.8), 0 0 18px rgba(255, 34, 0, 0.5);
            transform: scale(1);
            animation: flameFlicker 1.2s infinite alternate;
            vertical-align: middle;
            margin-left: 6px;
        }

        .custom-flame-badge::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 3px;
            width: 7px;
            height: 12px;
            background: radial-gradient(circle, #ffff00 0%, #ff5500 100%);
            border-radius: 50%;
            opacity: 0.9;
        }

        @keyframes flameFlicker {
            0% { transform: scale(1) rotate(-3deg); box-shadow: 0 0 8px rgba(255, 85, 0, 0.7), 0 0 14px rgba(255, 34, 0, 0.4); }
            100% { transform: scale(1.1) rotate(3deg); box-shadow: 0 0 14px rgba(255, 170, 0, 0.9), 0 0 22px rgba(255, 34, 0, 0.7); }
        }
    </style>
